[project]
name = "study-errorbook"
version = "0.1.0"
description = "Evidence-grounded TextIn study tools for MCP agents"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.26,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "pillow>=11.3,<13",
  "pypdfium2>=4.30,<6",
  "python-dotenv>=1.1,<2",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1", "pyyaml>=6,<7"]

[project.scripts]
study-errorbook = "study_errorbook.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
